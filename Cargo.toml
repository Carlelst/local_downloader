[package]
name = "video_processor"
version = "0.1.0"
edition = "2021"

[[example]]
name = "logging_example"
path = "examples/logging_example.rs"

[lib]
name = "video_processor"
path = "./src/lib.rs"

[dependencies]
thiserror = "1.0" # 确保错误处理库版本兼容
# 异步运行时和并发支持
tokio = { version = "1.0", features = ["full"] }

# HTTP 客户端
reqwest = { version = "0.11", features = ["json", "stream"] }

# 实用工具
regex = "1.7"
hex = "0.4"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.3"
bytes = "1.4"
md5 = "0.7"
lazy_static = "1.4"

# 加密相关
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
# PNG 伪装流 playlist 的 zlib 解压（roUd payload: 0x01 + zlib(m3u8)）
flate2 = "1.0"

# 序列化支持
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# 随机数生成器
rand = "0.8"

# 给子进程等待加超时（防止 ffmpeg 卡死冻死 segment worker）
wait-timeout = "0.2"

# Futures support
futures = "0.3"
futures-util = "0.3"

# Parallel computing
rayon = "1.7"
num_cpus = "1.15"

# 新增依赖
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
clap = { version = "4.0", features = ["derive"] }

# Unix系统调用 (条件编译)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 基准测试和测试工具
criterion = "0.3"
tokio-test = "0.4"
mockito = "0.31.0"
proptest = "1.0"
tempfile = "3.0"
