[package]
name = "video_processor"
version = "0.1.0"
edition = "2018"

[lib]
name = "video_processor"   
path = "./src/lib.rs"        

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
regex = "1"
hex = "0.4"
log = "0.4"
env_logger = "0.9"
anyhow = "1.0"
aes = "0.7"
block-modes = "0.8"
chrono = "0.4"
futures = "0.3"
rand = "0.8"
criterion = "0.3"
tokio-test = "0.4"
url = "2.2"
bytes = "1.0"