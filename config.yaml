max_concurrent_downloads: 4  # 降低并发下载数以避免服务器限制
download_retries: 3          # 减少重试次数以加快失败处理
segment_timeout: 20          # 减少超时时间
retry_interval: 2            # 减少重试间隔
chunk_size: 2097152         # 增加下载块大小到 2MB

# 输出配置
output_directory: "./downloads"  # 输出文件的目录
video_format: "mp4"              # 输出视频格式，如 mp4, mkv, flv
video_codec: "copy"              # 视频编码，通常使用 copy 以避免重新编码
audio_codec: "aac"               # 音频编码，如 aac, copy, mp3

# 系统配置
log_level: "info"                # 日志级别，可选："debug", "info", "warn", "error"
buffer_size: 8388608             # 缓冲区大小（字节），默认 8MB
validate_segments: false        # 禁用片段验证以加快启动
use_hw_accel: true             # 启用硬件加速
thread_count: 4               # 设置 FFmpeg 线程数