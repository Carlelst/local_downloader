max_concurrent_downloads: 8  # phncdn 单连接限速 ~1.5-4Mbps，提高并发即提高总带宽
download_retries: 3          # 减少重试次数以加快失败处理
segment_timeout: 20          # 减少超时时间
retry_interval: 2            # 减少重试间隔
chunk_size: 2097152         # 增加下载块大小到 2MB

# 输出配置
output_directory: "./downloads"  # 输出文件的目录
video_format: "mp4"              # 输出视频格式，如 mp4, mkv, flv
video_codec: "copy"              # 视频编码，通常使用 copy 以避免重新编码
audio_codec: "copy"               # TS 音轨本就是 AAC，copy 避免 CPU 重编码

# 系统配置
log_level: "info"                 # 日志级别，可选："debug", "info", "warn", "error"
buffer_size: 8388608             # 缓冲区大小（字节），默认 8MB
validate_segments: false        # 禁用片段验证以加快启动
use_hw_accel: true             # 启用硬件加速
thread_count: 4               # 设置 FFmpeg 线程数
# 全局默认 Referer（当域名匹配失败时使用）
referer: "https://www.javrate.com/"

# 域名特定的 Referer 映射
# 根据 M3U8 URL 的域名自动选择对应的 Referer
referers:
  surrit.com: "https://missav.ws/cn/mird-285-uncensored-leak"
  phncdn.com: "https://www.pornhub.com/"
  xssz-av.com: "https://cn.xsz-av.com/"
  v1.xszcdn6.com: "https://cn.xsz-av.com/"
  v3.xszav.net: "https://cn.xsz-av.com/"
  # eporner 对未知 Referer 会 302 到 na.mp4 (Not Available) 导致 404，
  # 必须带自身域名 Referer 或不带
  eporner.com: "https://www.eporner.com/"
  # kanav.ad（maccms 采集站）的 m3u8 CDN，多个子域轮换
  11yun.space: "https://kanav.ad/"
  # 91quanji.com 的 m3u8 CDN（域名含随机段，可能轮换；换了抓新 curl 报给我）
  s8jamrmtps5.sbs: "https://91quanji.com/"
  # avgood.com：m3u8 与分片同域自托管（remote_m3u8 路径，AES-128 + t=小时级签名），
  # 必须带自身 Referer，且站点在 CF 后需走系统代理
  avgood.com: "https://avgood.com/"
  # rou.video 家族伪装流 CDN：节点域名常变（fuzb14/gokj68/monb18/rn245/cexd14... 均为 *.xyz）
  # 通配符 *.xyz 覆盖所有 xyz 节点；如遇需不同 Referer 的 xyz 站点，用具体域名条目覆盖（优先级更高）
  "*.xyz": "https://rou.video/"

# Referer 不变，cookie 已不需要（curl-cffi 自动处理 Cloudflare TLS 指纹）


m3u8_urls:

# PNG 伪装流（rou.video 风格）：playlist 和分片都伪装成 PNG，藏在 roUd chunk 中。
# 填入 index.png 的完整 URL（含 ?v=&exp=&auth= 认证参数），
# 程序会自动解出 playlist（分片为多个节点的绝对 URL，每片带独立 auth），
# 并发下载全部分片并合成 mp4。auth 有时效（exp 参数），过期后需重新抓取。
png_urls:
# - https://kamq40.xyz/hls/<video_id>/<video_id>-720/index.png?v=6&exp=<unix时间戳>&auth=<签名>
# 也可只填 index.png 播放页地址；auth 过期后重新抓取即可

