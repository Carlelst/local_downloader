version: '3'
services:
  rust-app:
    build: .
    volumes:
      - .:/usr/src/app
    ports:
      - "8088:8088"  
    # command: cargo watch -x run
    environment:
      RUST_LOG: "debug"  # 配置环境变量，按需更改
    depends_on:
      - database  # 如果需要数据库等其他服务，可在此配置依赖关系

  # 示例数据库服务（可选）
  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: rust_video_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # 挂载卷保存数据库数据

volumes:
  pgdata: